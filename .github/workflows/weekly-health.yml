name: Weekly health

# Раз в неделю прогоняем тесты и сборку — ловит поломки от обновлений
# зависимостей (dependabot) и расхождение документации, даже без пушей.
on:
  schedule:
    - cron: "0 6 * * 1" # каждый понедельник, 06:00 UTC
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "mkdocs>=1.5,<2" "mkdocs-material>=9.0,<10" \
                      "pymdown-extensions>=10" "mkdocs-static-i18n>=1.2,<2"

      - name: Tests
        run: pytest -q

      - name: Docs duplication guard
        run: python tools/check_docs_sync.py

      - name: Docs build
        run: mkdocs build
