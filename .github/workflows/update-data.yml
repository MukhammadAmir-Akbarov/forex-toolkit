name: Update market data

# Раз в неделю скачиваем свежие котировки и пересобираем витрины сайта
# («Неделя на рынке», теплокарта, банк Replay и прочие JSON в _mkdocs/data).
# Пуш коммита с обновлением сам запускает Tests и Deploy — данные проходят
# тот же контроль, что и ручные правки.
on:
  schedule:
    # Понедельник, 05:17 UTC: неделя закрылась, данные за неё полные.
    # Неровная минута — чтобы не толпиться в часовом пике Actions.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write # нужно для пуша коммита с обновлёнными JSON

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch quotes
        run: python tools/fetch_quotes.py

      - name: Rebuild showcases
        run: python tools/rebuild_showcase_data.py

      # Нет изменений — нет коммита: пустые «обновления» только шумят
      # в истории и зря гоняют деплой.
      - name: Commit updated data
        run: |
          if git diff --quiet -- _mkdocs/data/; then
            echo "Данные не изменились — коммит не нужен."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _mkdocs/data/
          git commit -m "chore(data): еженедельное обновление витрин из свежих котировок"
          git push
