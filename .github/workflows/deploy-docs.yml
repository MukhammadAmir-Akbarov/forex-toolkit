name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "_mkdocs/**"
      - "mkdocs.yml"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libs for social cards (Cairo/Pango)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev \
                                  libjpeg-dev libpng-dev libz-dev libpango1.0-dev

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install "mkdocs>=1.5,<2" "mkdocs-material[imaging]>=9.0,<10" \
                      "pymdown-extensions>=10" "mkdocs-static-i18n>=1.2,<2" \
                      "mkdocs-git-revision-date-localized-plugin>=1.2"

      - name: Build and deploy
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          MKDOCS_SOCIAL: "true"   # включает генерацию соц-превью карточек
        run: mkdocs gh-deploy --force --clean --verbose
