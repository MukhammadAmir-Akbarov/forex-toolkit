name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest --tb=short -q

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest with coverage threshold
        # Покрытие меряется по пакету forex_toolkit (см. pyproject [tool.coverage]),
        # фактически ~98%. Порог можно только повышать.
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90 -q

  lint:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          python -m pip install --upgrade pip ruff mypy
          pip install -e .
      - name: ruff check (пакет forex_toolkit держим чистым)
        run: ruff check forex_toolkit/
      - name: ruff format --check (пакет)
        run: ruff format --check forex_toolkit/
      - name: ruff check tools/ hooks/ (логические правила; E501 игнор по конфигу)
        run: ruff check tools/ hooks/
      - name: ruff check + format (тесты)
        run: |
          ruff check tests/ tests_e2e/
          ruff format --check tests/ tests_e2e/
      - name: mypy (информационно, не блокирует)
        continue-on-error: true
        run: mypy
      # ~6300 строк браузерных виджетов раньше не проверялись ничем: линт был
      # только для Python. Опечатка в имени глобальной переменной доходила до
      # браузера пользователя.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: eslint (браузерные виджеты)
        run: |
          npm ci
          npx eslint _mkdocs/javascripts
      # Быстрые сверки логики виджетов с Python идут в песочнице Node — им
      # нужен тот же setup-node, что и линтеру, поэтому живут в этом джобе.
      - name: Быстрые сверки виджетов (без браузера)
        run: |
          python -m pip install pytest
          pip install -e .
          python -m pytest tests/test_widget_logic.py -q

  package:
    name: Wheel install + CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build
        run: python -m pip install --upgrade pip build
      - name: Build wheel
        run: python -m build --wheel
      - name: Install wheel in a clean venv and run every CLI command
        run: |
          python -m venv /tmp/cli_test
          /tmp/cli_test/bin/pip install dist/*.whl
          set -e
          for cmd in forex-position forex-backtest forex-journal \
                     forex-risk-profile forex-broker-check forex-news \
                     forex-correlations forex-monte-carlo; do
            echo "→ $cmd --help"
            /tmp/cli_test/bin/$cmd --help > /dev/null
          done
          echo "✅ все 8 CLI-команд работают из установленного wheel"

  docs:
    name: Docs build + duplication guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install "mkdocs>=1.5,<2" "mkdocs-material>=9.0,<10" \
                      "pymdown-extensions>=10" "mkdocs-static-i18n>=1.2,<2" \
                      "mkdocs-git-revision-date-localized-plugin>=1.2"
      - name: No root↔_mkdocs duplicates
        run: python tools/check_docs_sync.py
      - name: Translation coverage (информационно, не блокирует)
        continue-on-error: true
        run: python tools/check_translation_coverage.py
      - name: Translation drift (свежесть переводов)
        run: python tools/check_translation_drift.py --fail-on-drift
      - name: Content freshness
        run: python tools/check_freshness.py --fail
      - name: mkdocs build --strict (битые ссылки и якоря валят сборку)
        run: mkdocs build --strict
      - name: Внутренние якоря (#fragment) ведут на существующие заголовки
        run: python tools/check_links.py

  lighthouse:
    name: Lighthouse / a11y (I23)
    runs-on: ubuntu-latest
    # Информационный джоб: не блокирует мерж, пока пороги не устоялись.
    # Когда средние оценки стабилизируются — убрать continue-on-error.
    continue-on-error: true
    needs: docs  # сначала убеждаемся, что сайт собирается без ошибок
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install "mkdocs>=1.5,<2" "mkdocs-material>=9.0,<10" \
                      "pymdown-extensions>=10" "mkdocs-static-i18n>=1.2,<2" \
                      "mkdocs-git-revision-date-localized-plugin>=1.2"
      - name: Build site
        run: mkdocs build --quiet
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x
      - name: Run Lighthouse CI (RU + EN + UZ)
        # lhci autorun читает .lighthouserc.yml, сервирует site/, проверяет пороги.
        run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  e2e:
    name: Widget e2e (JS-математика == Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package + e2e deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,e2e]"
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Run browser tests (собирает сайт, сверяет виджеты с tools/)
        run: pytest tests_e2e/ -q
