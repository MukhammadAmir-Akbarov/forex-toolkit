site_name: Forex Trading Toolkit
site_description: Образовательный проект — учебник, инструменты, стратегии
site_author: forex-trading project
site_url: https://mukhammadamir-akbarov.github.io/forex-toolkit/

repo_url: https://github.com/MukhammadAmir-Akbarov/forex-toolkit
repo_name: MukhammadAmir-Akbarov/forex-toolkit
edit_uri: edit/main/_mkdocs/

docs_dir: _mkdocs
site_dir: site

extra_css:
  - stylesheets/calculators.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ru
          default: true
          name: 🇷🇺 Русский
          build: true
        - locale: en
          name: 🇬🇧 English
          build: true
          site_name: "Forex Trading Toolkit (English)"
        - locale: uz
          name: 🇺🇿 O'zbek
          build: true
          site_name: "Forex Trading Toolkit (O'zbek)"

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Светлая тема
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true

nav:
  - 🏠 Начало:
      - Главная: index.md
      - 🗺️ Дорожная карта обучения: roadmap.md
      - Как пользоваться: КАК-ПОЛЬЗОВАТЬСЯ.md
      - Главный учебник: forex-guide.md
  - 📚 Углублённо:
      - Технический анализ: docs/technical-analysis.md
      - Учебная стратегия: docs/strategy-details.md
      - 📈 Реальный анализ EUR/USD: docs/real-analysis.md
  - 🧠 Психология и дисциплина:
      - Психология трейдинга: extras/psychology.md
      - Anti-Tilt протокол: extras/anti-tilt-protocol.md
      - Emergency card: extras/emergency-card.md
      - Daily routine: extras/daily-routine.md
  - 📋 Шаблоны:
      - Trading Plan: extras/trading-plan-template.md
      - First 100 Days: extras/first-100-days.md
      - Чек-лист: extras/checklist-printable.md
      - FAQ: extras/faq.md
      - Глоссарий: extras/glossary.md
      - Сравнение брокеров: extras/brokers-comparison.md
      - 📡 Источники данных и сигналов: extras/market-data-sources.md
      - Mind map: extras/mind-map.md
  - 📝 Журнал:
      - Шаблон: journal/trading-journal-template.md
      - Расширенный: journal/journal-extended.md
      - Demo vs Real: journal/demo-vs-real-comparison.md
      - Mistakes log: journal/mistakes-log.md
      - README: journal/README.md
  - 🛠️ Инструменты:
      - 📐 Калькулятор позиции: tools/position-calculator.md
      - 💲 Калькулятор пипса: tools/pip-calculator.md
      - 📈 Сложный процент: tools/compound-calculator.md
      - Tools README: tools/README.md
      - Bot README: bot/README.md
  - 🚀 Продвинутое:
      - MT5 setup: advanced/SETUP-mt5.md
      - Streamlit setup: advanced/SETUP-streamlit.md
      - Telegram bot: advanced/SETUP-telegram.md
      - VPS deployment: advanced/SETUP-vps-deployment.md
  - 🌱 После года:
      - Order Flow / Volume Profile: growth/order-flow-volume-profile.md
      - Crypto trading: growth/crypto-trading-guide.md
      - Stocks basics: growth/stocks-basics.md
  - 🇺🇿 Узбекистан:
      - Брокеры для УЗ: uz/brokers-uz.md
      - Вывод денег: uz/withdrawal-guide.md
      - Сообщества: uz/communities.md

