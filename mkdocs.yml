extra:
  # Приватная аналитика без cookie (GoatCounter) — лёгкая, без баннера согласия,
  # дружелюбна к медленному мобильному. Скрипт подключается из overrides/main.html
  # ТОЛЬКО когда здесь задан endpoint. Заведи бесплатный аккаунт на goatcounter.com
  # и раскомментируй строку ниже со своим кодом:
  goatcounter: https://forex-toolkit.goatcounter.com/count

  # Комментарии giscus (поверх GitHub Discussions, без бэкенда и без cookie).
  # Рендерятся внизу страниц из overrides/partials/comments.html, когда задан
  # этот блок. ID получены через GitHub API для репозитория forex-toolkit.
  # ⚠️ Чтобы комментарии РАБОТАЛИ, владелец репо должен один раз установить
  # giscus app: https://github.com/apps/giscus → Install → выбрать forex-toolkit.
  # До установки виджет покажет «giscus is not installed». Чтобы выключить
  # комментарии — закомментируй весь блок giscus ниже.
  # giscus: (закомментировано — установи giscus app на репо чтобы включить:
  #   https://github.com/apps/giscus → Install → forex-toolkit)
  # giscus:
  #   repo: MukhammadAmir-Akbarov/forex-toolkit
  #   repo_id: R_kgDOSi9ouA
  #   category: Announcements
  #   category_id: DIC_kwDOSi9ouM4C9qBu

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MukhammadAmir-Akbarov/forex-toolkit
      name: GitHub
    - icon: fontawesome/brands/telegram
      link: https://github.com/MukhammadAmir-Akbarov/forex-toolkit/discussions
      name: Discussions
  # Виджет «Была ли страница полезна?» включён. Чтобы данные собирались в
  # Google Analytics — заведи бесплатный GA4 и добавь сюда:
  #   analytics: { provider: google, property: G-XXXXXXXXXX, feedback: {...} }
  analytics:
    feedback:
      title: Была ли страница полезна?
      ratings:
        - icon: material/emoticon-happy-outline
          name: Эта страница помогла
          data: 1
          note: Спасибо за обратную связь!
        - icon: material/emoticon-sad-outline
          name: Эту страницу можно улучшить
          data: 0
          note: |
            Спасибо! Помоги улучшить —
            <a href="https://github.com/MukhammadAmir-Akbarov/forex-toolkit/discussions" target="_blank">опиши в Discussions</a>.

