site_name: Forex Trading Toolkit
site_description: Образовательный проект — учебник, инструменты, стратегии
site_author: forex-trading project
site_url: https://mukhammadamir-akbarov.github.io/forex-toolkit/

repo_url: https://github.com/MukhammadAmir-Akbarov/forex-toolkit
repo_name: MukhammadAmir-Akbarov/forex-toolkit
edit_uri: edit/main/_mkdocs/

docs_dir: _mkdocs
site_dir: site

# Хук подставляет языковой словарь подсказок (includes/abbreviations.<lang>.md)
# на каждую страницу по её локали — RU/EN/UZ получают термины на своём языке.
hooks:
  - hooks/glossary_tooltips.py

extra_css:
  - stylesheets/extra.css
  - stylesheets/calculators.css

extra_javascript:
  - javascripts/reading.js
  - javascripts/progress.js
  # Переключатель письма лотин ⇄ кирилл — активен только на узбекской локали.
  - javascripts/translit.js

plugins:
  - search
  # Соц-превью карточки (Open Graph). Требуют graphics-зависимостей,
  # поэтому по умолчанию выключены; включаются флагом MKDOCS_SOCIAL=true
  # (в CI-деплое и при локальном просмотре карточек).
  - social:
      enabled: !ENV [MKDOCS_SOCIAL, false]
      cards_layout_options:
        background_color: "#0d1117"
        color: "#e6edf3"
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
