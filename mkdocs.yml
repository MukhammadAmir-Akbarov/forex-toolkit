theme:
  name: material
  # Локальные шаблонные переопределения (overrides/main.html подключает
  # приватную аналитику GoatCounter, когда задан extra.goatcounter).
  custom_dir: overrides
  language: ru
  font:
    text: Inter
    code: JetBrains Mono
  features:
    # navigation.instant НЕ включаем: он ломает контекстный переключатель
    # языков mkdocs-static-i18n (RU/EN/UZ должны переключаться постранично).
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.tooltips
    - content.code.copy
    - content.code.annotate
  palette:
    # Премиум тёмная тема — по умолчанию для всех новых посетителей
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Переключить на светлую тему
    # Светлая тема — доступна по переключателю (выбор запоминается)
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Переключить на тёмную тему
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # abbr + content.tooltips → всплывающие подсказки терминов. Сам словарь
  # подставляется по-язычно хуком hooks/glossary_tooltips.py (см. выше).
  - abbr
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
      # Unicode-slugify: кириллические заголовки дают кириллические якоря,
      # иначе оглавления (#что-такое-forex …) не совпадают с заголовками.
      slugify: !!python/name:pymdownx.slugs.uslugify

