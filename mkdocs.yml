site_name: Forex Trading Toolkit
site_description: Образовательный проект — учебник, инструменты, стратегии
site_author: forex-trading project
site_url: https://mukhammadamir-akbarov.github.io/forex-toolkit/

repo_url: https://github.com/MukhammadAmir-Akbarov/forex-toolkit
repo_name: MukhammadAmir-Akbarov/forex-toolkit
edit_uri: edit/main/_mkdocs/

docs_dir: _mkdocs
site_dir: site

# Хук подставляет языковой словарь подсказок (includes/abbreviations.<lang>.md)
# на каждую страницу по её локали — RU/EN/UZ получают термины на своём языке.
hooks:
  - hooks/glossary_tooltips.py

extra_css:
  - stylesheets/extra.css
  - stylesheets/calculators.css

extra_javascript:
  - javascripts/reading.js
  - javascripts/progress.js

plugins:
  - search
  # Соц-превью карточки (Open Graph). Требуют graphics-зависимостей,
  # поэтому по умолчанию выключены; включаются флагом MKDOCS_SOCIAL=true
  # (в CI-деплое и при локальном просмотре карточек).
  - social:
      enabled: !ENV [MKDOCS_SOCIAL, false]
      cards_layout_options:
        background_color: "#0d1117"
        color: "#e6edf3"
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ru
          default: true
          name: 🇷🇺 Русский
          build: true
        - locale: en
          name: 🇬🇧 English
          build: true
          site_name: "Forex Trading Toolkit (English)"
        - locale: uz
          name: 🇺🇿 O'zbek
          build: true
          site_name: "Forex Trading Toolkit (O'zbek)"
  # Дата последнего обновления страницы (из git-истории).
  # ВАЖНО: должен идти ПОСЛЕ i18n (i18n добавляет переменную locale).
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      fallback_to_build_date: true
      locale: ru

theme:
  name: material
  language: ru
  font:
    text: Inter
    code: JetBrains Mono
  features:
    # navigation.instant НЕ включаем: он ломает контекстный переключатель
    # языков mkdocs-static-i18n (RU/EN/UZ должны переключаться постранично).
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.tooltips
    - content.code.copy
    - content.code.annotate
  palette:
    # Премиум тёмная тема — по умолчанию для всех новых посетителей
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Переключить на светлую тему
    # Светлая тема — доступна по переключателю (выбор запоминается)
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Переключить на тёмную тему
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # abbr + content.tooltips → всплывающие подсказки терминов. Сам словарь
  # подставляется по-язычно хуком hooks/glossary_tooltips.py (см. выше).
  - abbr
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
      # Unicode-slugify: кириллические заголовки дают кириллические якоря,
      # иначе оглавления (#что-такое-forex …) не совпадают с заголовками.
      slugify: !!python/name:pymdownx.slugs.uslugify

nav:
  - 🏠 Начало:
      - Главная: index.md
      - 🗺️ Дорожная карта обучения: roadmap.md
      - Как пользоваться: КАК-ПОЛЬЗОВАТЬСЯ.md
      - Главный учебник: forex-guide.md
  - 📚 Углублённо:
      - Технический анализ: docs/technical-analysis.md
      - Учебная стратегия: docs/strategy-details.md
      - 📈 Реальный анализ EUR/USD: docs/real-analysis.md
  - 🎯 Из практики (2 года):
      - Обзор раздела: practice/README.md
      - 🥇 Торговля золотом (XAUUSD): practice/gold-trading.md
      - 🎯 ЛОТ - главное: practice/lot-discipline.md
      - 🛡️ Сейф (Move to BE): practice/breakeven-protocol.md
      - 📈 Доливка (Scaling-in): practice/scaling-in.md
      - 🔁 Циклы рынка: practice/cycle-theory.md
      - 🏛️ Структура рынка: practice/market-structure.md
  - 🧠 Психология и дисциплина:
      - Психология трейдинга: extras/psychology.md
      - Anti-Tilt протокол: extras/anti-tilt-protocol.md
      - Emergency card: extras/emergency-card.md
      - Daily routine: extras/daily-routine.md
      - 🚦 Предторговый чек-лист: extras/pre-trade-check.md
  - 📋 Шаблоны:
      - Trading Plan: extras/trading-plan-template.md
      - First 100 Days: extras/first-100-days.md
      - 🏆 Мой прогресс: extras/progress.md
      - Чек-лист: extras/checklist-printable.md
      - FAQ: extras/faq.md
      - Глоссарий: extras/glossary.md
      - Сравнение брокеров: extras/brokers-comparison.md
      - 📡 Источники данных и сигналов: extras/market-data-sources.md
      - Mind map: extras/mind-map.md
  - 📝 Журнал:
      - Шаблон: journal/trading-journal-template.md
      - Расширенный: journal/journal-extended.md
      - 📅 Еженедельный отчёт: journal/weekly-report-template.md
      - Demo vs Real: journal/demo-vs-real-comparison.md
      - Mistakes log: journal/mistakes-log.md
      - README: journal/README.md
  - 🛠️ Инструменты:
      - 📐 Калькулятор позиции: tools/position-calculator.md
      - 💲 Калькулятор пипса: tools/pip-calculator.md
      - 📈 Сложный процент: tools/compound-calculator.md
      - 📊 WinRate × RR: tools/winrate-rr-calculator.md
      - 🎴 Тренажёр карточек: tools/flashcards.md
      - "🎯 Квиз — готов к реалу?": tools/quiz.md
      - 🎲 Риск разорения: tools/risk-of-ruin.md
      - Tools README: tools/README.md
      - Bot README: bot/README.md
  - 🚀 Продвинутое:
      - MT5 setup: advanced/SETUP-mt5.md
      - Streamlit setup: advanced/SETUP-streamlit.md
      - Telegram bot: advanced/SETUP-telegram.md
      - VPS deployment: advanced/SETUP-vps-deployment.md
  - 🌱 После года:
      - Order Flow / Volume Profile: growth/order-flow-volume-profile.md
      - Crypto trading: growth/crypto-trading-guide.md
      - Stocks basics: growth/stocks-basics.md
  - 🇺🇿 Узбекистан:
      - Брокеры для УЗ: uz/brokers-uz.md
      - Вывод денег: uz/withdrawal-guide.md
      - Сообщества: uz/communities.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MukhammadAmir-Akbarov/forex-toolkit
      name: GitHub
    - icon: fontawesome/brands/telegram
      link: https://github.com/MukhammadAmir-Akbarov/forex-toolkit/discussions
      name: Discussions
  # Виджет «Была ли страница полезна?» включён. Чтобы данные собирались в
  # Google Analytics — заведи бесплатный GA4 и добавь сюда:
  #   analytics: { provider: google, property: G-XXXXXXXXXX, feedback: {...} }
  analytics:
    feedback:
      title: Была ли страница полезна?
      ratings:
        - icon: material/emoticon-happy-outline
          name: Эта страница помогла
          data: 1
          note: Спасибо за обратную связь!
        - icon: material/emoticon-sad-outline
          name: Эту страницу можно улучшить
          data: 0
          note: |
            Спасибо! Помоги улучшить —
            <a href="https://github.com/MukhammadAmir-Akbarov/forex-toolkit/discussions" target="_blank">опиши в Discussions</a>.

