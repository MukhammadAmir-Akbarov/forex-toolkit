site_name: Forex Trading Toolkit
site_description: Образовательный проект — учебник, инструменты, стратегии
site_author: forex-trading project
site_url: https://mukhammadamir-akbarov.github.io/forex-toolkit/

repo_url: https://github.com/MukhammadAmir-Akbarov/forex-toolkit
repo_name: MukhammadAmir-Akbarov/forex-toolkit
edit_uri: edit/main/_mkdocs/

docs_dir: _mkdocs
site_dir: site

# Хук подставляет языковой словарь подсказок (includes/abbreviations.<lang>.md)
# на каждую страницу по её локали — RU/EN/UZ получают термины на своём языке.
hooks:
  - hooks/glossary_tooltips.py
  # Счётчики страниц, инструментов, стратегий и тестов берутся из репозитория.
  - hooks/project_stats.py
  # Структурированные данные schema.org (JSON-LD) для SEO rich-результатов.
  - hooks/structured_data.py
  # Статическое кириллическое зеркало /uz-cyrl/ (post-build, серверный рендер).
  # Должен идти ПОСЛЕ structured_data.py, чтобы JSON-LD уже был в <head>.
  - hooks/translit_cyrl.py

extra_css:
  - stylesheets/extra.css
  - stylesheets/calculators.css

extra_javascript:
  - javascripts/analytics.js
  - javascripts/offline.js
  - javascripts/reading.js
  - javascripts/progress.js
  # Мелкие правки доступности (имя для диалога поиска) — Lighthouse a11y.
  - javascripts/a11y.js
  # Подсказка на гамбургере при первом визите с телефона. Стили для неё лежат
  # в extra.css (.fx-menu-hint), а сам скрипт из списка когда-то выпал: CSS
  # ездил на каждой странице, а класс ему никто не ставил.
  - javascripts/mobile-menu-hint.js
  # Переключатель письма лотин ⇄ кирилл — активен только на узбекской локали.
  - javascripts/translit.js
  # Глобально остаётся только то, что нужно нескольким страницам:
  # _i18n.js (определяет window.FXW, обязан идти первым) и очередь тренировок.
  # Все виджеты-калькуляторы подключаются постранично через `widgets:` во
  # front matter (см. overrides/main.html). Раньше они висели глобально:
  # безопасно, но 38 KB gzip на каждой странице против 2.4 KB сейчас.
  - javascripts/widgets/_i18n.js
  - javascripts/widgets/_training-queue.js
  - javascripts/hero.js

plugins:
  - search
  # Соц-превью карточки (Open Graph). Требуют graphics-зависимостей,
  # поэтому по умолчанию выключены; включаются флагом MKDOCS_SOCIAL=true
  # (в CI-деплое и при локальном просмотре карточек).
  - social:
      enabled: !ENV [MKDOCS_SOCIAL, false]
      cards_layout_options:
        background_color: "#0d1117"
        color: "#e6edf3"
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ru
          default: true
          name: 🇷🇺 Русский
          build: true
