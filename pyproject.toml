[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forex-toolkit"
version = "0.1.0"
description = "Forex trading educational toolkit: calculators, backtester, strategies, journal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "forex-trading project" },
]
keywords = ["forex", "trading", "backtest", "education", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "matplotlib>=3.5,<4",
    "numpy>=1.20,<3",
    "pandas>=1.5,<3",
    "yfinance>=0.2,<2",
    "requests>=2.28,<3",
    "beautifulsoup4>=4.11,<5",
    "jinja2>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<10",
    "pytest-cov>=4.0,<8",
    "mkdocs>=1.5,<2",
    "mkdocs-material>=9.0,<10",
]
docs = ["python-docx>=0.8,<2", "reportlab>=3.6,<5"]
web = ["streamlit>=1.20,<2", "plotly>=5.0,<7"]
mt5 = ["MetaTrader5; sys_platform == 'win32'"]
crypto = ["python-binance>=1.0,<2"]
all = [
    "forex-toolkit[dev,docs,web,crypto]",
]

[project.urls]
"Homepage" = "https://github.com/MukhammadAmir-Akbarov/forex-toolkit"
"Bug Tracker" = "https://github.com/MukhammadAmir-Akbarov/forex-toolkit/issues"
"Documentation" = "https://MukhammadAmir-Akbarov.github.io/forex-toolkit"

[project.scripts]
forex-position = "forex_toolkit.cli:position_calculator"
forex-backtest = "forex_toolkit.cli:backtest"
forex-journal = "forex_toolkit.cli:journal"
forex-risk-profile = "forex_toolkit.cli:risk_profile"
forex-broker-check = "forex_toolkit.cli:broker_check"
forex-news = "forex_toolkit.cli:news"
forex-correlations = "forex_toolkit.cli:correlations"
forex-monte-carlo = "forex_toolkit.cli:monte_carlo"

[tool.hatch.build.targets.wheel]
packages = ["forex_toolkit"]

[tool.hatch.build.targets.wheel.force-include]
"bot/strategy.py" = "forex_toolkit/_strategy.py"
"bot/backtest.py" = "forex_toolkit/_backtest.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["forex_toolkit", "tools", "bot", "strategies"]
omit = ["tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
