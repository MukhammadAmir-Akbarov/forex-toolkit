[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forex-toolkit"
version = "0.1.0"
description = "Forex trading educational toolkit: calculators, backtester, strategies, journal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mukhammad Amir Akbarov" },
]
maintainers = [
    { name = "Mukhammad Amir Akbarov" },
]
keywords = ["forex", "trading", "backtest", "education", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Russian",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    # Протестировано на numpy 2.x / pandas 3.x / Python 3.12 (см. CI и CLAUDE.md).
    # Нижние границы — минимально совместимые версии, верхние отсекают ещё не
    # протестированные мажорные релизы, чтобы расчёты воспроизводились.
    "matplotlib>=3.5,<4",
    "numpy>=1.24,<3",
    "pandas>=2.0,<4",
    "yfinance>=0.2,<1",
    "requests>=2.28,<3",
    "beautifulsoup4>=4.11,<5",
    "jinja2>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<10",
    "pytest-cov>=4.0,<8",
    "mkdocs>=1.5,<2",
    "mkdocs-material>=9.0,<10",
    "mkdocs-static-i18n>=1.2,<2",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
]
docs = ["python-docx>=0.8,<2", "reportlab>=3.6,<5"]
web = ["streamlit>=1.20,<2", "plotly>=5.0,<7"]
mt5 = ["MetaTrader5; sys_platform == 'win32'"]
crypto = ["python-binance>=1.0,<2"]
all = [
    "forex-toolkit[dev,docs,web,crypto]",
]

[project.urls]
"Homepage" = "https://github.com/MukhammadAmir-Akbarov/forex-toolkit"
"Bug Tracker" = "https://github.com/MukhammadAmir-Akbarov/forex-toolkit/issues"
"Documentation" = "https://MukhammadAmir-Akbarov.github.io/forex-toolkit"

[project.scripts]
forex-position = "forex_toolkit.cli:position_calculator"
forex-backtest = "forex_toolkit.cli:backtest"
forex-journal = "forex_toolkit.cli:journal"
forex-risk-profile = "forex_toolkit.cli:risk_profile"
forex-broker-check = "forex_toolkit.cli:broker_check"
forex-news = "forex_toolkit.cli:news"
forex-correlations = "forex_toolkit.cli:correlations"
forex-monte-carlo = "forex_toolkit.cli:monte_carlo"

[tool.hatch.build.targets.wheel]
packages = ["forex_toolkit"]

[tool.hatch.build.targets.wheel.force-include]
# Скрипты инструментов вшиваются в wheel, чтобы CLI-команды работали из
# установленного пакета (forex_toolkit/cli.py ищет их в forex_toolkit/_tools/).
"tools/position_calculator.py" = "forex_toolkit/_tools/position_calculator.py"
"tools/journal_cli.py" = "forex_toolkit/_tools/journal_cli.py"
"tools/risk_profile.py" = "forex_toolkit/_tools/risk_profile.py"
"tools/broker_check.py" = "forex_toolkit/_tools/broker_check.py"
"tools/news_scraper.py" = "forex_toolkit/_tools/news_scraper.py"
"tools/market_correlations.py" = "forex_toolkit/_tools/market_correlations.py"
"tools/monte_carlo.py" = "forex_toolkit/_tools/monte_carlo.py"
# backtest импортирует strategy как соседний модуль — кладём рядом.
"bot/backtest.py" = "forex_toolkit/_tools/backtest.py"
"bot/strategy.py" = "forex_toolkit/_tools/strategy.py"
# PEP 561: маркер типизации — чтобы mypy/IDE у потребителей видели тайпинги.
"forex_toolkit/py.typed" = "forex_toolkit/py.typed"

[tool.hatch.build.targets.sdist]
# В sdist кладём пакет + исходники CLI-скриптов (tools/, bot/), тесты и лицензии,
# чтобы из исходника можно было собрать тот же wheel (force-include читает tools/).
include = [
    "/forex_toolkit",
    "/tools",
    "/bot",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/LICENSE-CONTENT.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.coverage.run]
# Меряем покрытие ТОЛЬКО публикуемого пакета. tools/bot/strategies — это
# скрипты и учебные примеры; их непокрытые строки искажали метрику до ~19%
# и делали гейт бессмысленным. Пакет покрыт хорошо — гейт теперь осмысленный.
source = ["forex_toolkit"]
omit = ["tests/*", "*/conftest.py", "*/cli.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [".venv", "site", "dist", "_mkdocs", "материал"]

[tool.ruff.lint]
# Стартовый набор правил. Пакет forex_toolkit держим чистым — CI проверяет его
# строго (ruff check + format). Исторический код в tools/ и advanced/ чистим
# постепенно: `ruff check --fix . && ruff format .`.
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
# tools/ и hooks/ — скрипты и генераторы (print/HTML-шаблоны/формулы), где
# длинные строки читаемее переноса. Логические правила (F*, E741) держим
# строго и в CI (job lint), а длину строки (E501) здесь не требуем.
"tools/**" = ["E501"]
"hooks/**" = ["E501"]

[tool.mypy]
files = ["forex_toolkit"]
ignore_missing_imports = true
